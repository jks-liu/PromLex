[package]
name = "promlex"
version = "1.0.1"
description = "AI translation studio for text and documents"
authors = ["PromLex contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "promlex_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "promlex"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
csv = "1.3"
directories = "6"
fontdb = "0.23"
lopdf = { version = "0.44", default-features = false }
mime_guess = "2"
parking_lot = "0.12"
printpdf = { version = "0.12.7", default-features = false }
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
